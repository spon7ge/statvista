# statvista — live site Docker stack
#
# Services:
#   api       FastAPI. Published on 127.0.0.1 for /docs; the site calls it
#             through nginx on the compose network.
#   web       nginx static site, loopback only. Put Caddy or another TLS
#             proxy on the host in front of 127.0.0.1:8080.
#   odds      HTTP scrapers on a loop (PrizePicks stays on the host)
#
# Containers use SUPABASE_DB_URL from .env. That value is the host URL
# (localhost for local Postgres, the Supabase host otherwise).
#
# Local Postgres also needs docker-compose.local-db.yml, which points
# containers at the postgres hostname and refuses to start without a password:
#   cp .env.docker.example .env
#   docker compose -f docker-compose.yml -f docker-compose.local-db.yml --profile local-db up -d --build
#
# Supabase:
#   docker compose -f docker-compose.yml -f docker-compose.supabase.yml up -d --build
#
# See docker/README.md for full docs.

name: statvista

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    logging: *logging
    mem_limit: 512m
    # Loopback only, so /docs stays available on the host and the port is
    # not reachable from other machines. The site uses nginx, not this port.
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      SUPABASE_DB_URL: ${SUPABASE_DB_URL:?set SUPABASE_DB_URL in .env}
      # nginx on the same origin does not need CORS. The default is Vite on
      # the host. Set CORS_ORIGINS in .env to the public site origin when a
      # browser on another host calls the API directly.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    volumes:
      - ./data/cache:/app/data/cache
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    logging: *logging
    mem_limit: 512m
    # Loopback only. A TLS proxy on the host (Caddy, or the platform) is the
    # public listener.
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  odds:
    build:
      context: .
      dockerfile: docker/Dockerfile.odds
    logging: *logging
    mem_limit: 512m
    env_file:
      - path: .env
        required: false
    environment:
      SUPABASE_DB_URL: ${SUPABASE_DB_URL:?set SUPABASE_DB_URL in .env}
      ODDS_LEAGUE: ${ODDS_LEAGUE:-all}
      ODDS_EXCLUDE: ${ODDS_EXCLUDE:-wnba_prizepick,nba_prizepick,mlb_prizepick}
      ODDS_INTERVAL_SECONDS: ${ODDS_INTERVAL_SECONDS:-300}
    volumes:
      - ./data/props:/app/data/props
    restart: unless-stopped
