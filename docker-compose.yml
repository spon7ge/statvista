# statvista — live site Docker stack
#
# Services:
#   postgres  Local Postgres (optional — use Supabase by overriding SUPABASE_DB_URL)
#   api       FastAPI (WNBA/MLB adapters + odds.* reads)
#   web       nginx: static React app, /api proxied to api
#   odds      HTTP scrapers on a loop (PrizePicks stays on the host)
#
# Quick start:
#   cp .env.docker.example .env
#   docker compose --profile local-db up -d --build
#
# See docker/README.md for full docs.

name: statvista

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hoopvista}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hoopvista}
      POSTGRES_DB: ${POSTGRES_DB:-hoopvista}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-migrations:ro
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hoopvista} -d ${POSTGRES_DB:-hoopvista}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    profiles: ["local-db"]

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SUPABASE_DB_URL: ${SUPABASE_DB_URL:-postgresql://${POSTGRES_USER:-hoopvista}:${POSTGRES_PASSWORD:-hoopvista}@host.docker.internal:${POSTGRES_PORT:-5433}/${POSTGRES_DB:-hoopvista}?sslmode=disable}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}
    volumes:
      - ./data/cache:/app/data/cache
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  odds:
    build:
      context: .
      dockerfile: docker/Dockerfile.odds
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SUPABASE_DB_URL: ${SUPABASE_DB_URL:-postgresql://${POSTGRES_USER:-hoopvista}:${POSTGRES_PASSWORD:-hoopvista}@host.docker.internal:${POSTGRES_PORT:-5433}/${POSTGRES_DB:-hoopvista}?sslmode=disable}
      ODDS_LEAGUE: ${ODDS_LEAGUE:-all}
      ODDS_EXCLUDE: ${ODDS_EXCLUDE:-wnba_prizepick,mlb_prizepick}
      ODDS_INTERVAL_SECONDS: ${ODDS_INTERVAL_SECONDS:-300}
    volumes:
      - ./data/props:/app/data/props
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    restart: unless-stopped

volumes:
  pgdata:
