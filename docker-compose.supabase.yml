# Override for external Supabase (no local Postgres container).
#
# Usage:
#   cp .env.docker.example .env   # set SUPABASE_DB_URL to Supabase
#   docker compose -f docker-compose.yml -f docker-compose.supabase.yml up -d --build

services:
  postgres:
    profiles: ["disabled"]

  api:
    depends_on: !reset null
    environment:
      # Replaces the local postgres URL. Compose interpolates this from .env,
      # and this key wins over the base file's environment entry.
      SUPABASE_DB_URL: ${SUPABASE_DB_URL:?set SUPABASE_DB_URL in .env}

  odds:
    depends_on: !reset null
    environment:
      SUPABASE_DB_URL: ${SUPABASE_DB_URL:?set SUPABASE_DB_URL in .env}
